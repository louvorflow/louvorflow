<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LouvorFlow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#4A74FF;--purple:#6A5CFF;--bg:#F5F7FB;--white:#fff;--dark:#1A1A1A;--gray:#6B7280;--border:#E7EAF3;--blue-light:#E9EDFF;--green:#22C55E;--red:#EF4444;--yellow:#F59E0B}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--dark);height:100vh;height:100dvh;overflow:hidden;-webkit-text-size-adjust:100%}
@supports (-webkit-touch-callout: none){body{height:-webkit-fill-available}#app{height:-webkit-fill-available}}
#auth-screen{display:flex;align-items:center;justify-content:center;height:100vh;height:100dvh;background:linear-gradient(135deg,#4A74FF,#6A5CFF);padding:16px;position:fixed;top:0;left:0;right:0;bottom:0}
.auth-card{background:#fff;border-radius:20px;padding:32px 28px;width:100%;max-width:390px;box-shadow:0 20px 60px rgba(0,0,0,.15);max-height:95vh;overflow-y:auto}
.auth-logo{text-align:center;margin-bottom:20px}
.auth-logo .icon{font-size:32px}
.auth-logo h2{font-size:20px;font-weight:800;margin-top:6px}
.auth-logo p{color:var(--gray);font-size:12px}
.tab-btns{display:flex;background:#F3F4F6;border-radius:10px;padding:4px;margin-bottom:18px}
.tab-btn{flex:1;padding:8px;border:none;background:transparent;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;color:var(--gray);transition:.2s}
.tab-btn.active{background:#fff;color:var(--dark);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.form-group{margin-bottom:13px}
.form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;outline:none;background:var(--bg);transition:.2s}
.form-group input:focus{border-color:var(--blue);background:#fff}
.form-group input:read-only{background:#F0F2F8;color:var(--gray);cursor:not-allowed}
.btn-primary{width:100%;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary:hover{background:#3a63f0}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-link{background:none;border:none;color:var(--blue);font-size:12px;font-weight:600;cursor:pointer;margin-top:10px;display:block;text-align:center;width:100%}
.roles-picker{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.rp-item{padding:5px 10px;border-radius:20px;border:1.5px solid var(--border);font-size:11px;font-weight:600;cursor:pointer;background:var(--bg);color:var(--gray);transition:.2s;user-select:none}
.rp-item.selected{background:var(--blue-light);border-color:var(--blue);color:var(--blue)}
.ministry-type-picker{display:flex;gap:8px;margin-top:4px}
.mtp-item{flex:1;padding:12px 8px;border-radius:12px;border:2px solid var(--border);font-size:11px;font-weight:700;cursor:pointer;background:var(--bg);color:var(--gray);transition:.2s;text-align:center;user-select:none}
.mtp-item .mtp-icon{font-size:22px;display:block;margin-bottom:5px}
.mtp-item.selected{background:var(--blue-light);border-color:var(--blue);color:var(--blue)}
.join-ministry-box{background:var(--blue-light);border-radius:12px;padding:14px;margin:14px 0;border:1.5px dashed rgba(74,116,255,.3)}
.join-ministry-box h4{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:6px}
.join-ministry-box p{font-size:11px;color:var(--gray);margin-bottom:10px}
#app{display:none;height:100vh;height:100dvh;flex-direction:column;position:fixed;top:0;left:0;right:0;bottom:0}
header{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;z-index:100}
.header-left{display:flex;align-items:center;gap:10px}
.logo-img{width:34px;height:34px;background:linear-gradient(135deg,var(--blue),var(--purple));border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0}
.header-left h4{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.header-right{display:flex;align-items:center;gap:10px}
.hamburger{display:none;background:none;border:none;font-size:22px;cursor:pointer;padding:4px}
.avatar{width:34px;height:34px;background:linear-gradient(135deg,var(--blue),var(--purple));border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;cursor:pointer;flex-shrink:0}
.user-menu{position:relative}
.dropdown{position:absolute;top:42px;right:0;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.1);width:170px;z-index:300;display:none;overflow:hidden}
.dropdown.open{display:block}
.dropdown a{display:block;padding:11px 16px;font-size:14px;color:var(--dark);text-decoration:none;cursor:pointer;transition:.15s}
.dropdown a:hover{background:var(--bg)}
.dropdown a.danger{color:var(--red)}
.main-area{display:flex;flex:1;overflow:hidden;min-height:0}
aside{width:240px;background:#fff;border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex-shrink:0;transition:left .3s ease;min-height:0}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;color:var(--gray);transition:.2s;border:none;background:transparent;width:100%;text-align:left}
.nav-item:hover{background:var(--blue-light);color:var(--blue)}
.nav-item.active{background:var(--blue-light);color:var(--blue)}
.nav-item .ni{font-size:16px;width:20px}
.nav-section{font-size:10px;font-weight:700;color:#B0B8CC;text-transform:uppercase;letter-spacing:.8px;padding:10px 12px 4px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200}
.sidebar-overlay.open{display:block}
main{flex:1;overflow-y:auto;padding:20px 16px;min-height:0;-webkit-overflow-scrolling:touch}
.page{display:none}
.page.active{display:block}

/* ── DASHBOARD NOVO ── */
.dash-section-label{font-size:10px;font-weight:800;color:#B0B8CC;text-transform:uppercase;letter-spacing:1px;margin:18px 0 8px;display:flex;align-items:center;gap:6px}
.dash-section-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* Hero card — próximo evento */
.hero-event-card{background:linear-gradient(135deg,#4A74FF,#6A5CFF);border-radius:16px;padding:18px;color:#fff;margin-bottom:6px;position:relative;overflow:hidden}
.hero-event-card::before{content:'🎵';position:absolute;right:-10px;top:-10px;font-size:80px;opacity:.08}
.hero-ev-label{font-size:10px;font-weight:700;opacity:.75;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.hero-ev-name{font-size:18px;font-weight:800;margin-bottom:2px}
.hero-ev-sub{font-size:12px;opacity:.8;margin-bottom:14px}
.no-event-card{background:#fff;border-radius:16px;padding:20px;text-align:center;border:2px dashed var(--border);margin-bottom:6px}
.no-event-card p{color:var(--gray);font-size:13px;margin-bottom:10px}

/* Stats com contexto */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.stat-card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.05);position:relative;overflow:hidden}
.stat-card .sc-icon{font-size:20px;margin-bottom:6px}
.stat-card .sc-num{font-size:22px;font-weight:800}
.stat-card .sc-label{font-size:10px;color:var(--gray);margin-top:1px}
.stat-card .sc-trend{font-size:10px;font-weight:700;margin-top:4px;display:inline-flex;align-items:center;gap:2px;padding:2px 6px;border-radius:20px}
.sc-trend.up{background:#DCFCE7;color:#16A34A}
.sc-trend.neutral{background:#F3F4F6;color:var(--gray)}
.sc-trend.down{background:#FEE2E2;color:#B91C1C}
.stat-card .sc-bar{height:3px;border-radius:20px;background:var(--border);margin-top:8px;overflow:hidden}
.stat-card .sc-bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--blue),var(--purple))}

/* Semana cards */
.week-cards{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.week-event-card{background:#fff;border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 6px rgba(0,0,0,.04);border-left:4px solid var(--blue)}
.week-event-card.ensaio{border-left-color:var(--purple)}
.week-event-card.vigilia{border-left-color:var(--yellow)}
.wec-date{min-width:38px;text-align:center}
.wec-day{font-size:18px;font-weight:800;color:var(--blue);line-height:1}
.wec-mon{font-size:9px;font-weight:600;color:var(--gray);text-transform:uppercase}
.wec-info{flex:1}
.wec-name{font-size:13px;font-weight:700}
.wec-sub{font-size:11px;color:var(--gray);margin-top:2px}
.wec-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--blue-light);color:var(--blue);white-space:nowrap}

/* Alerta membro */
.member-alert-card{background:linear-gradient(135deg,#4A74FF,#6A5CFF);border-radius:14px;padding:18px;color:#fff;margin-bottom:6px}

/* gen box */
.gen-box{background:var(--blue-light);border-radius:14px;padding:18px;margin-bottom:14px}
.gen-box h3{font-size:15px;font-weight:700;color:var(--blue);margin-bottom:3px}
.
