<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LouvorFlow</title>
  <style>
    /* ── VARIÁVEIS GLOBAIS ── */
    :root {
      /* Cores principais */
      --blue:   #4A74FF;
      --purple: #6A5CFF;
      --bg:     #F5F7FB;
      --white:  #FFF;
      --dark:   #1A1A1A;
      --gray:   #6B7280;
      --border: #E7EAF3;

      /* Status */
      --status-available:   #22C55E;
      --status-unavailable: #EF4444;
      --status-pending:     #F59E0B;
      --status-confirmed:   #4A74FF;
      --status-refused:     #B91C1C;

      /* Modo escuro */
      --dark-bg:    #1A1A1A;
      --dark-text:  #F5F7FB;
      --dark-border:#333;
    }

    /* ── RESET & GLOBAL ── */
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Segoe UI',sans-serif;
      background: var(--bg);
      color: var(--dark);
      min-height: 100vh;
      overflow: hidden;
      transition: background .3s, color .3s;
    }
    .dark body {
      background: var(--dark-bg);
      color: var(--dark-text);
    }
    a { text-decoration:none; color:inherit; }

    /* ── HEADER ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; height: 58px;
      background: var(--white); border-bottom:1px solid var(--border);
      position: relative; z-index: 100;
    }
    header .logo { font-size:24px; color: var(--blue); }
    header .sync-indicator {
      font-size: 11px; color: var(--gray);
      position: absolute; bottom: -18px; right: 16px;
    }

    /* ── SIDEBAR ── */
    aside {
      width: 240px; background: var(--white); border-right:1px solid var(--border);
      overflow-y: auto; transition: transform .3s;
    }
    aside.hide { transform: translateX(-260px); }

    /* ── MAIN & PAGES ── */
    .main { display:flex; height: calc(100vh - 58px); }
    main { flex:1; overflow-y:auto; padding:20px; }
    .page { display:none; }
    .page.active { display:block; }

    /* ── DASHBOARD ── */
    .greeting { display:flex; align-items:center; justify-content: space-between; }
    .greeting h2 { font-size: 22px; font-weight:800; }
    .badge.status { padding: 4px 10px; border-radius:12px; font-size:10px; font-weight:700; }
    .badge.status.available   { background: var(--status-available); color:#fff; }
    .badge.status.unavailable { background: var(--status-unavailable); color:#fff; }
    .badge.status.pending     { background: var(--status-pending); color:#fff; }
    .badge.status.confirmed   { background: var(--status-confirmed); color:#fff; }
    .badge.status.refused     { background: var(--status-refused); color:#fff; }

    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin:20px 0; }
    .stat-card {
      background: var(--white); border-radius:12px; padding:16px;
      box-shadow: 0 4px 12px rgba(0,0,0,.05);
      position: relative; overflow:hidden;
    }
    .stat-card h3 { font-size:14px; font-weight:700; margin-bottom:6px; }
    .stat-card .number { font-size:24px; font-weight:800; }
    .stat-card .trend {
      position:absolute; bottom:12px; right:12px;
      font-size:11px; font-weight:600; padding:2px 6px;
      border-radius:10px; display:inline-flex; align-items:center; gap:4px;
    }
    .trend.up      { background:#DCFCE7; color:#16A34A; }
    .trend.down    { background:#FEE2E2; color:#B91C1C; }
    .trend.neutral { background:#F3F4F6; color:var(--gray); }

    /* ── WEEK EVENTS ── */
    .week-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
    .week-card {
      background: var(--white); border-radius:12px; padding:14px;
      box-shadow:0 2px 8px rgba(0,0,0,.04);
      display:flex; align-items:center; gap:12px;
    }
    .week-card .date-box {
      text-align:center; min-width:50px;
      background: var(--blue); color:#fff; border-radius:8px; padding:6px;
    }
    .wec-badge { font-size:11px; font-weight:700; padding:4px 8px; border-radius:20px; }
    .wec-badge.confirmed { background: var(--status-available); color:#fff; }
    .wec-badge.pending   { background: var(--status-pending);   color:#fff; }
    .wec-badge.none      { background: var(--gray);              color:#fff; }

    /* ── ESCALAS (COMPACTO) ── */
    .scale-day {
      border:1px solid var(--border); border-radius:10px; margin-bottom:16px;
      overflow:hidden; transition:background .3s;
    }
    .scale-day-header {
      display:flex; align-items:center; padding:12px; background: var(--blue); color:#fff;
      font-weight:700; justify-content: space-between;
    }
    .scale-day-list {
      display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    }
    .scale-row {
      display:flex; align-items:center; justify-content:space-between;
      padding:10px; border-bottom:1px solid var(--border);
    }
    .scale-row:last-child { border-bottom:none; }
    .scale-row .role { font-size:13px; flex:1; }
    .scale-row .member { font-size:12px; flex:1; color:var(--dark); }
    .scale-row .status { font-size:11px; }
    .scale-row .actions button {
      background:none; border:none; cursor:pointer; font-size:14px; margin-left:6px;
    }

    /* ── LOADING SKELETON ── */
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e7e7e7 37%, #f0f0f0 63%);
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
    }
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0;  }
    }

    /* ── DARK MODE TOGGLE ── */
    .dark-toggle {
      position:absolute; top:10px; right:60px;
      cursor:pointer; font-size:18px;
    }

    /* ── RESPONSIVIDADE SIMPLIFICADA ── */
    @media(max-width:768px) {
      .stats-grid { grid-template-columns:repeat(2,1fr); }
      .week-cards { grid-template-columns:1fr; }
      .scale-day-list { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

  <!-- Toggler Dark Mode -->
  <div class="dark-toggle" onclick="document.documentElement.classList.toggle('dark')">
    🌙/☀️
  </div>

  <!-- HEADER -->
  <header>
    <div class="logo">🎵 LouvorFlow</div>
    <div class="sync-indicator">Última sincronia: <span id="last-sync">--:--</span></div>
  </header>

  <!-- LATERAL E CONTEÚDO PRINCIPAL -->
  <div class="main">
    <aside id="sidebar">
      <!-- menu… -->
    </aside>
    <main>
      <!-- DASHBOARD -->
      <section id="dashboard" class="page active">
        <div class="greeting">
          <h2>Olá, João! 👋</h2>
          <span class="badge status.confirmed">Admin</span>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <h3>Eventos</h3>
            <div class="number" id="dash-ev-count">—</div>
            <div class="trend neutral" id="dash-ev-trend">—</div>
          </div>
          <div class="stat-card">
            <h3>Membros</h3>
            <div class="number" id="dash-mem-count">—</div>
            <div class="trend neutral" id="dash-mem-trend">—</div>
          </div>
          <div class="stat-card">
            <h3>Escalas</h3>
            <div class="number" id="dash-sc-count">—</div>
            <div class="trend neutral" id="dash-sc-trend">—</div>
          </div>
        </div>

        <h4>Esta semana</h4>
        <div class="week-cards" id="dash-week-events">
          <!-- skeleton enquanto carrega -->
          <div class="week-card skeleton" style="height:80px"></div>
          <div class="week-card skeleton" style="height:80px"></div>
          <div class="week-card skeleton" style="height:80px"></div>
        </div>
      </section>

      <!-- ESCALAS -->
      <section id="scales" class="page">
        <h2>Escalas</h2>
        <div id="scale-container">
          <!-- skeleton load -->
          <div class="scale-day">
            <div class="scale-day-header skeleton" style="height:40px"></div>
            <div class="scale-day-list">
              <div class="scale-row skeleton" style="height:30px"></div>
              <div class="scale-row skeleton" style="height:30px"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- …demais páginas e modais… -->

    </main>
  </div>

  <footer>
    <button onclick="sendSyncPing()">Sincronizar agora</button>
  </footer>

  <script>
    // exemplo de atualização do indicador de sync
    function updateSyncTime() {
      const now = new Date();
      document.getElementById('last-sync').textContent =
        now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateSyncTime, 5000);
    updateSyncTime();

    // função de simulação de refresh
    function sendSyncPing(){
      updateSyncTime();
      // aqui dispararíamos fullSync()
    }
  </script>
</body>
</html>
