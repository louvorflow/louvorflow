.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:14px;overflow:hidden}.card h3{font-size:14px;font-weight:700;margin-bottom:12px}

.scale-row-status{flex-shrink:0}.scale-row-btns{display:flex;gap:4px;flex-shrink:0}

td{padding:10px;border-bottom:1px solid var(--border);font-size:12px}tr:last-child td{border-bottom:none}

.scale-filter-bar .btn-clear{padding:8px 12px;background:var(--bg);border:1.5px solid var(--border);border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;color:var(--gray);white-space:nowrap;transition:.2s}.scale-filter-bar .btn-clear:hover{border-color:var(--blue);color:var(--blue)}
.scale-filter-info{font-size:11px;color:var(--gray);margin-bottom:10px;padding:6px 10px;background:var(--blue-light);border-radius:8px;display:none}.scale-filter-info.visible{display:block}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:600}

.members-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.member-card{background:#fff;border-radius:12px;padding:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.member-avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;margin:0 auto 8px}

.avail-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.avail-nav h3{font-size:15px;font-weight:700}
.avail-nav button{background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:14px;font-weight:700;color:var(--dark)}
.cal-header{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}.cal-header span{text-align:center;font-size:10px;font-weight:700;color:var(--gray);padding:3px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}

    <div class="auth-logo"><div class="icon">🎵</div><h2>LouvorFlow</h2
